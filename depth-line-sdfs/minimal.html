<!DOCTYPE html>
<html>
<head>
  <title>Depth Line SDFs</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="container">
    <canvas id="webglCanvas" style="width: 512px; height: 512px"></canvas>
  </div>
  <script>
    function star(cx, cy, r) {
      const numPoints = 5;
      const path = []
      const step = (2 * Math.PI) / numPoints;
      for (let i = 0; i < numPoints; i++) {
        const theta = i * step + (Math. PI / 2);
        path.push([cx + r * Math.cos(theta), cy + r * Math.sin(theta)]);
        path.push([cx + (r / 2) * Math.cos(theta + step / 2), cy + (r / 2) * Math.sin(theta + step / 2)]);
      }
      return path;
    }

    // The canvas goes from [-256, -256] to [256, 256]
    const paths = [
      star(-180, 80, 48),
      star(-100, -120, 48),
      star(166, -66, 64),
      star(-23, 143, 32),
    ];
    const numSegments = paths.reduce((sum, path) => (sum + path.length + 1), 0);

    // 8 vertices per segment, 5 floats per vertex
    const vertexData = new Float32Array(numSegments * 8 * 5);
    const indexData = new Uint16Array(numSegments * 18);
    let vertexDataOffset = 0;
    let indexDataOffset = 0;
    let segmentVertexOffset = 0;
    for (const path of paths) {
      for (let i = path.length - 1, j = 0; j < path.length; i = j, j++) {
        const start = path[i];
        const end = path[j];
        const dx = end[0] - start[0];
        const dy = end[1] - start[1];
        const length = Math.sqrt(dx * dx + dy * dy);
        const directionX = dx / length;
        const directionY = dy / length;
        const normalX = +directionY;
        const normalY = -directionX;
        // Segments that share a vertex produce end caps with regions of equidistance,
        // which causes ambiguities in the sign of the distance chosen by the depth test.
        // Contracting each segment slightly resolves the ambiguity.
        const contractionX = directionX * 0.1;
        const contractionY = directionY * 0.1;

        // Start cap
        vertexData[vertexDataOffset++] = start[0] + contractionX;
        vertexData[vertexDataOffset++] = start[1] + contractionY;
        vertexData[vertexDataOffset++] = -normalX - directionX;
        vertexData[vertexDataOffset++] = -normalY - directionY;
        vertexData[vertexDataOffset++] = -1;

        vertexData[vertexDataOffset++] = start[0] + contractionX;
        vertexData[vertexDataOffset++] = start[1] + contractionY;
        vertexData[vertexDataOffset++] = +normalX - directionX;
        vertexData[vertexDataOffset++] = +normalY - directionY;
        vertexData[vertexDataOffset++] = +1;

        // Segment start
        vertexData[vertexDataOffset++] = start[0] + contractionX;
        vertexData[vertexDataOffset++] = start[1] + contractionY;
        vertexData[vertexDataOffset++] = -normalX;
        vertexData[vertexDataOffset++] = -normalY;
        vertexData[vertexDataOffset++] = -1;

        vertexData[vertexDataOffset++] = start[0] + contractionX;
        vertexData[vertexDataOffset++] = start[1] + contractionY;
        vertexData[vertexDataOffset++] = +normalX;
        vertexData[vertexDataOffset++] = +normalY;
        vertexData[vertexDataOffset++] = +1;

        // Segment end
        vertexData[vertexDataOffset++] = end[0] - contractionX;
        vertexData[vertexDataOffset++] = end[1] - contractionY;
        vertexData[vertexDataOffset++] = -normalX;
        vertexData[vertexDataOffset++] = -normalY;
        vertexData[vertexDataOffset++] = -1;

        vertexData[vertexDataOffset++] = end[0] - contractionX;
        vertexData[vertexDataOffset++] = end[1] - contractionY;
        vertexData[vertexDataOffset++] = +normalX;
        vertexData[vertexDataOffset++] = +normalY;
        vertexData[vertexDataOffset++] = +1;

        // End cap
        vertexData[vertexDataOffset++] = end[0] - contractionX;
        vertexData[vertexDataOffset++] = end[1] - contractionY;
        vertexData[vertexDataOffset++] = -normalX + directionX;
        vertexData[vertexDataOffset++] = -normalY + directionY;
        vertexData[vertexDataOffset++] = -1;

        vertexData[vertexDataOffset++] = end[0] - contractionX;
        vertexData[vertexDataOffset++] = end[1] - contractionY;
        vertexData[vertexDataOffset++] = +normalX + directionX;
        vertexData[vertexDataOffset++] = +normalY + directionY;
        vertexData[vertexDataOffset++] = +1;

        // Start cap
        indexData[indexDataOffset++] = segmentVertexOffset + 0;
        indexData[indexDataOffset++] = segmentVertexOffset + 1;
        indexData[indexDataOffset++] = segmentVertexOffset + 2;
        indexData[indexDataOffset++] = segmentVertexOffset + 2;
        indexData[indexDataOffset++] = segmentVertexOffset + 1;
        indexData[indexDataOffset++] = segmentVertexOffset + 3;

        // Segment body
        indexData[indexDataOffset++] = segmentVertexOffset + 2;
        indexData[indexDataOffset++] = segmentVertexOffset + 3;
        indexData[indexDataOffset++] = segmentVertexOffset + 4;
        indexData[indexDataOffset++] = segmentVertexOffset + 4;
        indexData[indexDataOffset++] = segmentVertexOffset + 3;
        indexData[indexDataOffset++] = segmentVertexOffset + 5;

        // End cap
        indexData[indexDataOffset++] = segmentVertexOffset + 4;
        indexData[indexDataOffset++] = segmentVertexOffset + 5;
        indexData[indexDataOffset++] = segmentVertexOffset + 6;
        indexData[indexDataOffset++] = segmentVertexOffset + 6;
        indexData[indexDataOffset++] = segmentVertexOffset + 5;
        indexData[indexDataOffset++] = segmentVertexOffset + 7;
        segmentVertexOffset += 8;
      }
    }

    const canvas = document.querySelector("#webglCanvas");
    canvas.width = 512;
    canvas.height = 512;
    const gl = canvas.getContext("webgl2");

    const vertexSource = `#version 300 es
      precision highp float;

      #define SCALE ${1 / 256}
      #define HALF_WIDTH ${400 / 512}

      layout (location=0) in vec2 a_Position;
      layout (location=1) in vec2 a_Extrusion;
      layout (location=2) in float a_Sign;

      out vec2 v_Extrusion;
      out float v_Sign;

      void main() {
        v_Sign = a_Sign;
        v_Extrusion = a_Extrusion;
        gl_Position = vec4(a_Position * SCALE + a_Extrusion * HALF_WIDTH, 0.0, 1.0);
      }
      `;

    const fragmentSource = `#version 300 es
      precision highp float;

      #define TWO_PI 6.28
      #define ISOLINE_FREQUENCY 16.0

      in vec2 v_Extrusion;
      in float v_Sign;

      out vec4 outColor;

      void main() {
        float unsignedDistance = length(v_Extrusion);
        vec4 color = mix(vec4(0.8, 0.0, 1.0, 1.0), vec4(0.0, 0.8, 0.8, 1.0), sign(v_Sign));
        float alpha = abs(sin(ISOLINE_FREQUENCY * unsignedDistance * TWO_PI));
        outColor = color * alpha;
        gl_FragDepth = unsignedDistance;
      }
      `;

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, vertexSource);
    gl.compileShader(vertexShader);
    if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
      console.error("vertex shader:\n", gl.getShaderInfoLog(vertexShader));
    }

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, fragmentSource);
    gl.compileShader(fragmentShader);
    if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
      console.error("fragment shader:\n", gl.getShaderInfoLog(fragmentShader));
    }

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);

    const vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 8);
    gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 20, 16);

    const indexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexData, gl.STATIC_DRAW);

    gl.useProgram(program);
    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);

    gl.drawElements(gl.TRIANGLES, indexData.length, gl.UNSIGNED_SHORT, 0);
  </script>
</body>
</html>
